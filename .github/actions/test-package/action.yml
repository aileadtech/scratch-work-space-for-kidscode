name: Test package

description: Test one of the packages in this monorepo.

inputs:
  package_name:
    description: The name of the tested package
    required: true

runs:
  using: composite
  steps:
    - name: Install Playwright
      if: ${{ inputs.package_name == 'scratch-render' || inputs.package_name == 'scratch-gui' }}
      shell: bash
      # Install both browsers for any package that needs Playwright,
      # even if a particular package only uses one of them — keeping
      # the install step uniform is much simpler than maintaining a
      # per-package browser list, and Firefox in scratch-render is
      # cheap unused weight rather than a correctness problem.
      run: npx playwright install --with-deps chromium firefox
    - name: Rebuild scratch-gui build/ in development mode
      if: ${{ inputs.package_name == 'scratch-gui' }}
      working-directory: ./packages/scratch-gui
      shell: bash
      # The repo-root `npm run build` (the earlier Build job) sets NODE_ENV=production for every
      # workspace, so dist/ and dist-standalone/ are real production bundles. That also taints
      # build/ — the "examples and debugging tools" bundle (see webpack.config.js) that the
      # Selenium integration tests load via file:// — which disables
      # KidscodeWorkspaceLaunchHOC's development launch resolver and makes every launch fail
      # closed. Rebuild just build/ here, in this job only, forced back to development mode; the
      # artifact already uploaded for the Preview job is a separate copy and is unaffected.
      run: NODE_ENV=development BUILD_TYPE=dev npx webpack
    - name: Test
      working-directory: ./packages/${{ inputs.package_name }}
      shell: bash
      env:
        TAP_REPORTER: "junit"
        TAP_REPORTER_FILE: "test-results/junit.xml"
      # xvfb-run provides a virtual display for browsers that need one.
      # Firefox's non-headless mode (used because headless Firefox lacks
      # WebGL support) requires an X server, and xvfb fills that role
      # on the headless CI runner. Chromium doesn't need it but works
      # fine under xvfb too.
      run: |
        mkdir -p test-results
        xvfb-run --auto-servernum npm run test
    - name: Store Test Results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: ${{ inputs.package_name }}-test-output
        path: ./packages/${{ inputs.package_name }}/test-results/*
